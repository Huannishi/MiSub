name: 同步上游 MiSub

# 把 imzyb/MiSub 的更新合并进这个 fork。
# 同步产生的 push 会触发 Cloudflare Pages 的 Git 集成，自动重新构建部署。
#
# 注意：这个 fork 的 main 上额外承载着本 workflow 文件本身，
# 所以永远不可能与上游「完全一致」。同步必须用 merge，不能用 reset，
# 否则会把 workflow 自己删掉，push 也会被拒（non-fast-forward）。

on:
  schedule:
    # 每 6 小时检查一次（UTC 整点）
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: 同步上游
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/imzyb/MiSub.git 2>/dev/null \
            || git remote set-url upstream https://github.com/imzyb/MiSub.git

          git fetch --no-tags upstream main

          LOCAL=$(git rev-parse HEAD)
          REMOTE=$(git rev-parse upstream/main)

          echo "本地:   $LOCAL"
          echo "上游:   $REMOTE"

          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "✅ 与上游完全一致"
            exit 0
          fi

          # 上游已经是本地的祖先 → 本地只是多了 workflow 提交，无需同步
          if git merge-base --is-ancestor "$REMOTE" "$LOCAL"; then
            echo "✅ 上游已在本地历史中（本地仅多出 workflow 提交），无需同步"
            exit 0
          fi

          echo "🔁 检测到上游更新，开始合并"
          git merge --no-edit upstream/main

          git push origin main
          echo "✅ 已推送，Cloudflare Pages 将自动构建部署"
